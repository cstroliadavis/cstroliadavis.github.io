<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Christopher Strolia-Davis Favicon">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1f2e" />
      <stop offset="60%" stop-color="#134074" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="topBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="55%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
  </defs>

  <!-- Rounded Square Badge -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="2" />

  <!-- Top Signature Accent Bar -->
  <path d="M 14 3 H 50 A 11 11 0 0 1 60 10 H 4 A 11 11 0 0 1 14 3 Z" fill="url(#topBar)" />

  <!-- Code Bracket / Monogram: C S + Crimson Terminal Dot -->
  <text
    x="28"
    y="44"
    fill="#f8fafc"
    font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="28"
    font-weight="800"
    letter-spacing="-1.5"
    text-anchor="middle"
  >CS</text>

  <!-- Crimson Accent Node / Cursor -->
  <circle cx="51" cy="40" r="4.5" fill="#ef4444" />
</svg>
