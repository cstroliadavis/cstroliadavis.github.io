<svg
  aria-label="Christopher Strolia-Davis Favicon"
  role="img"
  viewBox="0 0 64 64"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <linearGradient
      id="bgGrad"

      x1="0%"
      x2="100%"
      y1="0%"
      y2="100%"
    >
      <stop offset="0%" stop-color="#0b1f2e" />
      <stop offset="60%" stop-color="#134074" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient
